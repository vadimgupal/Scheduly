name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test and lint
    runs-on: ubuntu-latest

    services:
      postgresql:
        image: postgres:16
        env:
          POSTGRES_DB: scrapper
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5435:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d scrapper"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests and Checkstyle
        run: mvn -B -fae clean verify

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build core image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: scheduly-core:test
          build-args: |
            MODULE=core

      - name: Build bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: scheduly-bot:test
          build-args: |
            MODULE=bot